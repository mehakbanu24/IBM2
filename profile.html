<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #74ebd5, #9face6);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      padding: 40px;
      text-align: center;
      width: 350px;
      border: 3px solid #6a5acd;
    }

    .card h1 {
      color: #6a5acd;
      font-size: 28px;
      margin-bottom: 20px;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
    }

    .circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #6a5acd;
      margin: 0 auto 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 20px;
      font-weight: bold;
      border: 4px solid #fff;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #6a5acd;
      color: white;
      border-radius: 25px;
      text-decoration: none;
      transition: 0.3s;
      font-weight: bold;
    }

    .btn:hover {
      background: #483d8b;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="circle">MM</div>
    <h1>This is a Profile Page</h1>
    <a href="#" class="btn">View More</a>
  </div>
</body>
</html>
